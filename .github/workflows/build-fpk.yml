name: Build Antigravity for fnOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Build amd64 and arm64 FPK packages
        run: bash scripts/build.sh all

      - name: Upload FPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-cli-fpk
          path: |
            dist/antigravity-cli-amd64.fpk
            dist/antigravity-cli-amd64.fpk.sha256
            dist/antigravity-cli-arm64.fpk
            dist/antigravity-cli-arm64.fpk.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download FPK artifacts
        uses: actions/download-artifact@v4
        with:
          name: antigravity-cli-fpk
          path: packages

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd packages
          sha256sum -c antigravity-cli-amd64.fpk.sha256
          sha256sum -c antigravity-cli-arm64.fpk.sha256
          gh release create "$TAG" --verify-tag --title "Antigravity for fnOS $TAG" \
            --notes "原生 fnOS FPK 安装包（支持 x86-64 与 ARM64）：
          - Go 单二进制零依赖（内嵌 React 前端）
          - Web Chat 图形化流式对话 + 内置 xterm.js Web 终端
          - 应用级代理配置、设置中心一键安装/升级 agy、专用应用用户隔离（antigravity-cli）" \
            antigravity-cli-amd64.fpk antigravity-cli-amd64.fpk.sha256 \
            antigravity-cli-arm64.fpk antigravity-cli-arm64.fpk.sha256
