name: Build Antigravity for fnOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Build amd64 and arm64 FPK packages
        run: bash scripts/build.sh all

      - name: Upload FPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-cli-fpk
          path: |
            dist/antigravity-cli-amd64.fpk
            dist/antigravity-cli-amd64.fpk.sha256
            dist/antigravity-cli-arm64.fpk
            dist/antigravity-cli-arm64.fpk.sha256
          if-no-files-found: error
